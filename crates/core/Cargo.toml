[package]
name = "binning-core"
description = "Agentic Binning: projects, analysis, sorting and file moves, free of any UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 with the processor's hashing instructions (see files::hasher); already in the app via rustls.
ring = "0.17"
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
kamadak-exif = "0.6"
ureq = { version = "2", features = ["json"] }
regex = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
parking_lot = "0.12"
fs4 = { version = "0.13", features = ["sync"] }

[dev-dependencies]
# Only to check that ring gives the same hashes the projects already store.
sha2 = "0.10"
parking_lot = "0.12"
image = { version = "0.25.5", default-features = false, features = ["png"] }
tempfile = "3"
regex = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
