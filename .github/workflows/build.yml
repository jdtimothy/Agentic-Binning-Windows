name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            rustup toolchain install stable --profile minimal
            rustup default stable
          }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-arm64-${{ hashFiles('Cargo.lock') }}

      - name: Test the core
        run: cargo test -p binning-core

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build the installer
        working-directory: src-tauri
        run: tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: agentic-binning-windows-arm64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/agentic-binning.exe
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentic-binning-windows-arm64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.exe
